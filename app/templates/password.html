{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block main %}
<div class="topbar"><div class="row"><button class="btn menu-btn" onclick="toggleMenu()">☰</button><div><h1>Change password</h1><div class="sub">{{ user.email }}</div></div></div></div>
<form class="card" method="post" action="/account/password" style="max-width:440px">
  {% if done %}<div class="callout" style="margin-bottom:12px">✓ Password changed. Use the new one next time you sign in.</div>{% endif %}
  {% if error %}<div class="callout warn" style="margin-bottom:12px">{{ error }}</div>{% endif %}
  <div style="display:grid;gap:12px">
    <label class="f">Current password<input name="current" type="password" required autocomplete="current-password"></label>
    <label class="f">New password (8+ characters)<input name="new" type="password" minlength="8" required autocomplete="new-password"></label>
    <label class="f">New password again<input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
    <div><button class="btn primary">Save new password</button></div>
  </div>
</form>
{% endblock %}
